[project]
name = "docchat-backend"
version = "0.1.0"
description = "DocChat — AI-powered document Q&A backend"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "aiofiles>=23.2",
    "asyncpg>=0.31.0",
    "redis>=5.0",
    "fastapi>=0.136.3",
    "uvicorn[standard]>=0.48.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.29",
    "email-validator>=2.3.0",
    "sqlalchemy>=2.0.50",
    "alembic>=1.18.4",
    "pgvector>=0.4.2",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "python-jose[cryptography]>=3.3.0",
    "arq>=0.28.0",
    "openai>=2.38.0",
    "pypdf>=6.12.2",
    "python-docx>=1.2.0",
]

[tool.uv]
dev-dependencies = [
    "ipython>=8.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
