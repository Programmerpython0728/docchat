# nginx reverse proxy — docchat.uz
# EC2 hostida ishlaydi, Docker konteynerga frontend (3000) va backend (8000) port'larni proksilaydi.
# SSL Cloudflare yoki Let's Encrypt (certbot) bilan beriladi.

# HTTP → HTTPS redirect (Let's Encrypt acme challenge'siga ruxsat berib)
server {
    listen 80;
    server_name docchat.uz www.docchat.uz;

    # Let's Encrypt acme challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Boshqa hammasi HTTPS'ga
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — asosiy server
server {
    listen 443 ssl http2;
    server_name docchat.uz www.docchat.uz;

    # SSL sertifikatlar (Let's Encrypt joylashuvi)
    ssl_certificate     /etc/letsencrypt/live/docchat.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docchat.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Yuklash limit (50 MB hujjat uchun)
    client_max_body_size 60M;

    # ============================================================
    # /api/v1/chat/ws — WebSocket (faqat /ws qism)
    # ============================================================
    location /api/v1/chat/ws {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;  # WS uchun uzun timeout
    }

    # ============================================================
    # /api/* — Backend (FastAPI)
    # ============================================================
    location /api/ {
        proxy_pass http://localhost:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    # ============================================================
    # /health va /docs — Backend
    # ============================================================
    location ~ ^/(health|docs|redoc|openapi.json) {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ============================================================
    # / — Frontend (Next.js)
    # ============================================================
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300;
    }
}
